<script src="data/produtos.js"></script>
<script>
  var DADOS = [], pronto = false, fLow=false, fHi=false;
  var q = document.getElementById('q'), list = document.getElementById('list'),
      count = document.getElementById('count'), msg = document.getElementById('msg'),
      sub = document.getElementById('sub'), catSel = document.getElementById('cat');

  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  if (window.__PRODUTOS__) {
    DADOS = window.__PRODUTOS__; pronto = true;
    var catmap = {};
    for(var i=0;i<DADOS.length;i++){
      var p=DADOS[i]; p._n=norm(p.n); p._h=norm(p.n+' '+(p.m||''));
      if(p.c) catmap[p.c]=(catmap[p.c]||0)+1;
    }
    var cats = Object.keys(catmap).sort(function(a,b){ return a.localeCompare(b,'pt'); });
    var opt = '<option value="">Todas as categorias ('+DADOS.length.toLocaleString('pt-BR')+')</option>';
    for(var i=0;i<cats.length;i++){ opt += '<option value="'+esc(cats[i])+'">'+esc(cats[i])+' ('+catmap[cats[i]]+')</option>'; }
    catSel.innerHTML = opt;
    sub.textContent = DADOS.length.toLocaleString('pt-BR') + ' produtos · busque por nome/marca ou escolha uma categoria.';
    q.disabled = false; q.focus();
  } else {
    sub.innerHTML = ''; msg.className = 'msg err';
    msg.textContent = 'Índice não carregou (data/produtos.js). Rode dados/exportar_web.py para gerar.';
  }

  function badge(nota){
    if(nota==null) return '';
    var cls = nota>=80?'b-hi':(nota>=55?'b-mid':'b-lo');
    return '<span class="badge '+cls+'">nota '+nota+'</span>';
  }

  // relevância: nome que começa com o termo > palavra inteira > começo de palavra > em qualquer lugar
  function score(p, qfull, words){
    var name=p._n, hay=p._h, s=0, pad=' '+name+' ';
    if(name.lastIndexOf(qfull,0)===0) s+=60;
    else if(name.indexOf(qfull)>=0) s+=25;
    for(var i=0;i<words.length;i++){
      var w=words[i];
      if(pad.indexOf(' '+w+' ')>=0) s+=10;
      else if(pad.indexOf(' '+w)>=0) s+=6;
      else if(hay.indexOf(w)>=0) s+=2;
    }
    s += (p.q||0)/40;        // desempate: melhor qualidade
    s -= name.length/300;    // nomes mais concisos (match mais específico) primeiro
    return s;
  }

  function buscar(){
    if(!pronto) return;
    var raw = q.value.trim();
    var termo = norm(raw), cat = catSel.value;
    var words = termo.split(/\s+/).filter(Boolean);
    var barcode = /^\d{8,14}$/.test(raw);   // veio do leitor (ou o número foi digitado)
    if(!words.length && !cat && !fLow && !fHi && !barcode){
      list.innerHTML=''; count.textContent=''; window.__RES__=[]; msg.style.display='block';
      msg.textContent='Digite algo ou escolha uma categoria.'; return;
    }
    var matches = [];
    if(barcode){
      var rawz=raw.replace(/^0+/,'');   // tolera zero à esquerda (UPC-A 12 díg. vs EAN-13)
      for(var i=0;i<DADOS.length;i++){ var pe=DADOS[i].e; if(pe && (''+pe).replace(/^0+/,'')===rawz) matches.push(DADOS[i]); }
    } else {
      for(var i=0;i<DADOS.length;i++){
        var p = DADOS[i];
        if(fLow && p.l!==1) continue;
        if(fHi && !(p.q>=80)) continue;
        if(cat && p.c!==cat) continue;
        if(words.length){
          var ok=true; for(var j=0;j<words.length;j++){ if(p._h.indexOf(words[j])<0){ ok=false; break; } }
          if(!ok) continue;
        }
        matches.push(p);
      }
    }
    var achou = matches.length;
    if(!barcode && words.length){
      for(var m=0;m<matches.length;m++){ matches[m]._s = score(matches[m], termo, words); }
      matches.sort(function(a,b){ return b._s - a._s; });
    } else if(!barcode){
      matches.sort(function(a,b){ return (b.q||0) - (a.q||0); });   // categoria só: melhores notas primeiro
    }
    msg.style.display = achou? 'none':'block';
    if(!achou){ list.innerHTML=''; count.textContent=''; window.__RES__=[]; msg.textContent = barcode?('Código '+raw+' não está no catálogo — veja o preço abaixo.'):'Nada encontrado.'; return; }
    var res = matches.slice(0, 60);
    window.__RES__ = res;
    count.textContent = 'mostrando '+res.length+' de '+achou.toLocaleString('pt-BR');
    var html='';
    for(var k=0;k<res.length;k++){
      var p=res[k];
      html += '<div class="prod" data-i="'+k+'" data-nome="'+esc(p.n)+'">'
            + (p.i?'<img class="thumb" loading="lazy" src="https://atacadaobr.vtexassets.com/arquivos/ids/'+p.i+'-96-96/p.jpg" alt="" onerror="this.style.visibility=\'hidden\'">':'<div class="thumb noimg">sem foto</div>')
            + '<div class="pbody"><div class="pn">'+esc(p.n)+'</div>'
            + '<div class="pm">'+esc(p.m||'—')+' · '+esc(p.c||'')+'</div>'
            + '<div class="meta">'+badge(p.q)
            + (p.l===1?'<span class="lc">low-carb</span>':'')
            + (p.e?'<span class="ean">'+esc(p.e)+'</span>':'')
            + '</div></div>'
            + '<button class="fav" data-i="'+k+'" title="favoritar">★</button>'
            + '</div>';
    }
    list.innerHTML = html;
    if(window.atualizarFavs) window.atualizarFavs();
  }

  var t;
  q.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(buscar,140); });
  catSel.addEventListener('change', buscar);
  document.getElementById('cLow').addEventListener('click', function(){ fLow=!fLow; this.setAttribute('aria-pressed',fLow); buscar(); });
  document.getElementById('cHi').addEventListener('click', function(){ fHi=!fHi; this.setAttribute('aria-pressed',fHi); buscar(); });
</script>

<script>
  // ===== LISTAS (client-side, localStorage — funciona no site público) =====
  var KEY='casa_listas', BACKEND=false, CURP=null;
  // Preço ao vivo: backend local (tailnet) quando existir; senão o Worker público (workers.dev).
  var WORKER='https://precos-casa.automercadomario.workers.dev';   // Worker de preços ao vivo (Cloudflare)
  function precosOn(){ return BACKEND || !!WORKER; }
  // ===== MERCADOS: quais lojas pesquisar (config da família, em localStorage) =====
  // Sem escolha salva, o servidor usa as lojas marcadas como padrão no catálogo.
  // O Worker público consulta no máximo LOJASMAX por vez (limite da Cloudflare);
  // o backend local, quando disponível, consulta todas.
  var LKEY='casa_mercados', CATLOJAS=null, LOJASMAX=12;
  function lojasSel(){ try{ var a=JSON.parse(localStorage.getItem(LKEY)); return (Array.isArray(a)&&a.length)?a:null; }catch(e){ return null; } }
  function lojasSet(a){ if(a&&a.length) localStorage.setItem(LKEY, JSON.stringify(a)); else localStorage.removeItem(LKEY); pintarChip(); }
  function baseURL(){ return BACKEND?'/api':WORKER; }
  function precoURL(termo,ean){
    var qs='?termo='+encodeURIComponent(termo||''); if(ean) qs+='&ean='+encodeURIComponent(ean);
    var sel=lojasSel(); if(sel) qs+='&lojas='+encodeURIComponent(sel.join(','));
    return baseURL()+'/precos'+qs;
  }
  function pintarChip(){
    var el=document.getElementById('lojascount'); if(!el) return;
    var sel=lojasSel();
    el.textContent = sel ? '('+sel.length+')' : (CATLOJAS? '('+CATLOJAS.padrao.length+')' : '');
  }
  function carregarCatalogo(cb){
    if(CATLOJAS) return cb(CATLOJAS);
    fetch(baseURL()+'/lojas').then(function(r){return r.json();}).then(function(j){
      CATLOJAS=j; LOJASMAX=j.max||LOJASMAX; pintarChip(); cb(j);
    }).catch(function(){ cb(null); });
  }
  if(precosOn()) document.body.classList.add('backend');   // cards clicáveis (cursor/hover) quando há preço ao vivo
  var drawer=document.getElementById('drawer'), dbody=document.getElementById('dbody'), dtitle=document.getElementById('dtitle');
  function getL(){ try{ var o=JSON.parse(localStorage.getItem(KEY)); if(o&&typeof o==='object'){ if(!o['Favoritos'])o['Favoritos']=[]; return o; } }catch(e){} return {'Favoritos':[]}; }
  function setL(o){ localStorage.setItem(KEY, JSON.stringify(o)); }
  function ik(p){ return p.e||p.n; }
  function estaNa(l,p){ var k=ik(p); return (l||[]).some(function(x){return (x.e||x.n)===k;}); }
  function togglear(nome,p){ var o=getL(); if(!o[nome])o[nome]=[]; var k=ik(p),i=o[nome].findIndex(function(x){return (x.e||x.n)===k;}); if(i>=0)o[nome].splice(i,1); else o[nome].push({n:p.n,m:p.m||'',e:p.e||'',i:p.i,c:p.c||''}); setL(o); return i<0; }
  function prodDe(el){ var i=el.getAttribute('data-i'); return (i!=null&&window.__RES__)?window.__RES__[+i]:null; }
  function esc2(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function money(v){ return (v==null)?'—':('R$ '+Number(v).toFixed(2).replace('.',',')); }
  window.fecharDrawer=function(){ drawer.classList.remove('open'); };

  window.atualizarFavs=function(){
    var fav=getL()['Favoritos']||[], set={}; for(var i=0;i<fav.length;i++) set[fav[i].e||fav[i].n]=1;
    var bs=document.querySelectorAll('.prod .fav'); for(var j=0;j<bs.length;j++){ var p=prodDe(bs[j]); bs[j].classList.toggle('on', !!(p&&set[p.e||p.n])); }
    var lc=document.getElementById('listcount'); if(lc){ var o=getL(),n=0; for(var kk in o)n++; lc.textContent=n; }
  };

  fetch('/api/health').then(function(r){return r.json();}).then(function(h){ if(h&&h.ok) BACKEND=true; }).catch(function(){});

  document.getElementById('list').addEventListener('click', function(e){
    var star=e.target.closest('.fav');
    if(star){ var p=prodDe(star); if(p){ var add=togglear('Favoritos',p); star.classList.toggle('on',add); window.atualizarFavs(); } return; }
    var card=e.target.closest('.prod'); if(card) abrirProduto(prodDe(card));
  });

  function abrirProduto(p){
    if(!p) return; CURP=p; dtitle.textContent=p.n;
    var o=getL();
    var chips=Object.keys(o).map(function(nm){ return '<button class="lchip'+(estaNa(o[nm],p)?' on':'')+'" data-lista="'+esc2(nm)+'">'+esc2(nm)+'</button>'; }).join('')
      + '<button class="lchip nova" data-nova="1">＋ nova lista</button>';
    var amzQ = encodeURIComponent(p.e || p.n || '');
    dbody.innerHTML='<div class="dsec">Salvar numa lista</div><div class="lchips">'+chips+'</div>'
      + (precosOn()?'<div class="dsec" style="margin-top:18px">Preço nas lojas</div><div id="precos"><div class="dload">buscando…</div></div>':'')
      + '<a class="amzbtn" href="https://www.amazon.com.br/s?k='+amzQ+'" target="_blank" rel="noopener">🔎 buscar na Amazon</a>';
    drawer.classList.add('open');
    if(precosOn()){
      fetch(precoURL(p.termo!=null?p.termo:p.n, p.e)).then(function(r){return r.json();}).then(function(res){
        var box=document.getElementById('precos'); if(!box) return;
        var ls=(res.lojas||[]).filter(function(x){return x.preco;});
        box.innerHTML = ls.length? ls.map(function(x){ var eff=x.promo||x.preco; var ex=x.promo?' <span style="color:var(--amber)">promo</span>':(x.atacado?' <span style="color:var(--faint)">atac '+money(x.atacado)+'</span>':'');
          var eqv=(x.match==='equivalente')?' <span class="eqv">≈ equivalente</span>':'';
          return '<div class="prow'+(x.barato?' barato':'')+'"><div class="pl"><b>'+esc2(x.loja)+'</b>'+eqv+'<small>'+esc2((x.produto||'').slice(0,46))+' · '+esc2(x.pu||'')+'</small></div><div class="pp">'+money(eff)+ex+'</div></div>'; }).join('') : '<div class="dload">nenhum equivalente encontrado.</div>';
      }).catch(function(){ var box=document.getElementById('precos'); if(box) box.innerHTML='<div class="dload">erro nos preços.</div>'; });
    }
  }

  // ===== Painel "quais mercados pesquisar" =====
  var _filtroLoja='';
  window.abrirMercados=function(){
    dtitle.textContent='Mercados';
    dbody.innerHTML='<div class="dload">carregando o catálogo…</div>';
    drawer.classList.add('open');
    carregarCatalogo(function(cat){
      if(!cat){ dbody.innerHTML='<div class="dload">não consegui carregar o catálogo de lojas.</div>'; return; }
      pintarMercados();
    });
  };
  function selAtual(){ var s=lojasSel(); return s? s.slice() : (CATLOJAS?CATLOJAS.padrao.slice():[]); }
  function pintarMercados(){
    var cat=CATLOJAS, sel=selAtual(), on={}; sel.forEach(function(i){on[i]=1;});
    var f=_filtroLoja.toLowerCase();
    var lojas=cat.lojas.filter(function(l){
      return !f || (l.nome+' '+(l.bairro||'')+' '+(l.rede||'')+' '+(l.tipo||'')).toLowerCase().indexOf(f)>=0;
    });
    var redes={}, ordem=[];
    lojas.forEach(function(l){ if(!redes[l.rede]){ redes[l.rede]=[]; ordem.push(l.rede);} redes[l.rede].push(l); });

    var alerta='';
    if(!BACKEND && sel.length>LOJASMAX)
      alerta='<div class="mwarn">⚠ o site consulta no máximo '+LOJASMAX+' mercados por vez — os '+(sel.length-LOJASMAX)+' últimos ficam de fora. Em casa, com o servidor ligado, vão todos.</div>';

    var corpo=ordem.map(function(rede){
      var itens=redes[rede], todosOn=itens.every(function(l){return on[l.id];});
      return '<div class="mrede"><b>'+esc2(rede)+'</b>'
        + '<button class="mall" data-rede="'+esc2(rede)+'">'+(todosOn?'desmarcar':'marcar todos')+'</button></div>'
        + itens.map(function(l){
            return '<label class="mrow'+(on[l.id]?' on':'')+'">'
              + '<input type="checkbox" data-loja="'+esc2(l.id)+'"'+(on[l.id]?' checked':'')+'>'
              + '<span class="mnome">'+esc2(l.nome)+'<small>'+esc2(l.bairro||'')
              + (l.min_entrega?' · mín. R$ '+Number(l.min_entrega).toFixed(0):'')
              + (l.tipo&&l.tipo!=='mercado'?' · '+esc2(l.tipo):'')+'</small></span></label>';
          }).join('');
    }).join('');

    dbody.innerHTML=
      '<div class="msum"><b>'+sel.length+'</b> de '+cat.total+' mercados · a pesquisa de preço usa esta lista</div>'
      + alerta
      + '<div class="mbtns">'
      +   '<button class="lact" data-preset="padrao">padrão</button>'
      +   '<button class="lact" data-preset="sudoeste">só perto de casa</button>'
      +   '<button class="lact" data-preset="mercados">só supermercados</button>'
      +   '<button class="lact" data-preset="nenhum">limpar</button>'
      + '</div>'
      + '<input class="mfiltro" id="mfiltro" type="search" placeholder="filtrar por nome, bairro ou tipo…" value="'+esc2(_filtroLoja)+'">'
      + '<div class="mlista">'+(corpo||'<div class="dload">nenhum mercado com esse filtro.</div>')+'</div>';

    var inp=document.getElementById('mfiltro');
    if(inp) inp.oninput=function(){ _filtroLoja=this.value; var p=this.selectionStart; pintarMercados();
      var n=document.getElementById('mfiltro'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
  }
  function aplicarPreset(qual){
    var cat=CATLOJAS; if(!cat) return;
    if(qual==='padrao') return lojasSet(null);                       // volta ao padrão do servidor
    if(qual==='nenhum') return lojasSet(cat.padrao.slice(0,1));      // 1 loja: lista vazia significaria "padrão"
    if(qual==='sudoeste')
      return lojasSet(cat.lojas.filter(function(l){ return /sudoeste|sia|noroeste/i.test((l.bairro||'')+' '+l.nome); }).map(function(l){return l.id;}));
    if(qual==='mercados')
      return lojasSet(cat.lojas.filter(function(l){ return l.tipo==='mercado'||l.tipo==='atacarejo'; }).map(function(l){return l.id;}));
  }

  function abrirListas(){
    var o=getL(); dtitle.textContent='Minhas listas';
    var rows=Object.keys(o).map(function(nm){ return '<div class="lrow"><b>'+esc2(nm)+'</b><span>'+o[nm].length+' itens</span><button class="lact" data-ver="'+esc2(nm)+'">ver</button></div>'; }).join('');
    dbody.innerHTML=rows+'<div class="lmanage"><button class="lact" data-nova2="1">＋ nova lista</button></div>';
    drawer.classList.add('open');
  }
  function verLista(nm){
    var o=getL(), itens=o[nm]||[]; dtitle.textContent=nm;
    var body=itens.length? itens.map(function(it,idx){ var img=it.i?'<img class="lthumb" src="https://atacadaobr.vtexassets.com/arquivos/ids/'+it.i+'-64-64/p.jpg" onerror="this.style.visibility=\'hidden\'">':'<span class="lthumb"></span>';
      return '<div class="prow">'+img+'<div class="pl"><b>'+esc2(it.n)+'</b><small>'+esc2(it.m||'')+'</small></div><button class="lx" data-del-item="'+idx+'" data-lista="'+esc2(nm)+'">✕</button></div>'; }).join('') : '<div class="dload">lista vazia — favorite produtos com a ★.</div>';
    dbody.innerHTML='<button class="lback" data-voltar="1">‹ voltar</button>'+body
      +'<div class="lmanage">'+(nm!=='Favoritos'?'<button class="lact" data-renomear="'+esc2(nm)+'">renomear</button><button class="lact del" data-apagar="'+esc2(nm)+'">apagar lista</button>':'')+'</div>';
    drawer.classList.add('open');
  }

  dbody.addEventListener('click', function(e){
    var t=e.target, chip=t.closest('.lchip');
    // --- painel de mercados ---
    if(t.getAttribute && t.getAttribute('data-preset')){ aplicarPreset(t.getAttribute('data-preset')); pintarMercados(); return; }
    if(t.getAttribute && t.getAttribute('data-rede')){
      var rede=t.getAttribute('data-rede'), sel=selAtual(), on={}; sel.forEach(function(i){on[i]=1;});
      var itens=CATLOJAS.lojas.filter(function(l){return l.rede===rede;});
      var todosOn=itens.every(function(l){return on[l.id];});
      itens.forEach(function(l){ if(todosOn) delete on[l.id]; else on[l.id]=1; });
      lojasSet(Object.keys(on)); pintarMercados(); return;
    }
    if(t.getAttribute && t.getAttribute('data-loja')){
      var id=t.getAttribute('data-loja'), s2=selAtual(), o2={}; s2.forEach(function(i){o2[i]=1;});
      if(o2[id]) delete o2[id]; else o2[id]=1;
      lojasSet(Object.keys(o2)); pintarMercados(); return;
    }
    if(chip && CURP){
      if(chip.getAttribute('data-nova')){ var nm=prompt('Nome da nova lista:'); if(nm&&nm.trim()){ togglear(nm.trim(),CURP); abrirProduto(CURP); window.atualizarFavs(); } }
      else { var nm2=chip.getAttribute('data-lista'); var add=togglear(nm2,CURP); chip.classList.toggle('on',add); window.atualizarFavs(); }
      return;
    }
    if(t.getAttribute('data-ver')){ verLista(t.getAttribute('data-ver')); return; }
    if(t.getAttribute('data-nova2')){ var n=prompt('Nome da nova lista:'); if(n&&n.trim()){ var oa=getL(); oa[n.trim()]=oa[n.trim()]||[]; setL(oa); abrirListas(); window.atualizarFavs(); } return; }
    if(t.getAttribute('data-voltar')){ abrirListas(); return; }
    if(t.getAttribute('data-del-item')!=null && t.getAttribute('data-lista')){ var od=getL(),ln=t.getAttribute('data-lista'); od[ln].splice(+t.getAttribute('data-del-item'),1); setL(od); verLista(ln); window.atualizarFavs(); return; }
    if(t.getAttribute('data-apagar')){ var la=t.getAttribute('data-apagar'); if(confirm('Apagar a lista "'+la+'"?')){ var oe=getL(); delete oe[la]; setL(oe); abrirListas(); window.atualizarFavs(); } return; }
    if(t.getAttribute('data-renomear')){ var lr=t.getAttribute('data-renomear'); var nn=prompt('Novo nome:',lr); if(nn&&nn.trim()&&nn.trim()!==lr){ var of=getL(); of[nn.trim()]=of[lr]; delete of[lr]; setL(of); verLista(nn.trim()); window.atualizarFavs(); } return; }
  });

  document.getElementById('listbtn').addEventListener('click', abrirListas);
  document.getElementById('lojasbtn').addEventListener('click', window.abrirMercados);
  if(precosOn()) carregarCatalogo(function(){});   // só p/ mostrar a contagem no chip
  window.atualizarFavs();
</script>

<script>
  // ===== LEITOR DE CÓDIGO DE BARRAS (EAN-13) — BarcodeDetector nativo (Android) =====
  (function(){
    var btn=document.getElementById('scanbtn');
    if(!btn || !('BarcodeDetector' in window)) return;   // só aparece onde é suportado (Android Chrome)
    try{
      window.BarcodeDetector.getSupportedFormats().then(function(fmts){
        if(fmts.indexOf('ean_13')>=0) btn.style.display='';
      }).catch(function(){});
    }catch(e){ return; }

    var detector=null, stream=null, track=null, timer=null, rodando=false, torchOn=false, ov=null;

    function eanValido(c){                            // dígito verificador mod-10 — EAN-13 e EAN-8
      if(!/^\d{13}$/.test(c) && !/^\d{8}$/.test(c)) return false;
      var d=c.split('').map(Number), dv=d.pop(), s=0;
      for(var i=d.length-1,k=0;i>=0;i--,k++){ s += d[i]*(k%2===0?3:1); }  // da direita: 3,1,3,1…
      return ((10-(s%10))%10) === dv;
    }
    function normaliza(c){ c=(c||'').replace(/\D/g,''); if(/^\d{12}$/.test(c)) c='0'+c; return c; } // UPC-A -> EAN-13

    function setMsg(t){ var m=document.getElementById('scanmsg'); if(m) m.textContent=t; }

    function abrir(){
      if(rodando) return; rodando=true;
      ov=document.createElement('div'); ov.id='scanov';
      ov.innerHTML='<video id="scanvid" playsinline muted></video><div class="scanbox"></div>'
        +'<div class="scantop"><button id="scanx" type="button">✕ fechar</button>'
        +'<button id="scantorch" type="button" style="display:none">🔦 luz</button></div>'
        +'<div class="scanmsg" id="scanmsg">Aponte para o código de barras</div>';
      document.body.appendChild(ov);
      document.getElementById('scanx').onclick=fechar;
      document.getElementById('scantorch').onclick=luz;
      iniciar();
    }

    function iniciar(){
      try{ detector=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a']}); }
      catch(e){ setMsg('Leitor não suportado neste aparelho.'); return; }
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})
        .then(function(s){
          // fechou (✕ ou app foi p/ segundo plano) enquanto o Android pedia permissão → não deixa a câmera ligada
          if(!rodando){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
          var v=document.getElementById('scanvid');
          if(!v){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
          stream=s; v.srcObject=s;
          track=s.getVideoTracks()[0];
          try{ var caps=track.getCapabilities&&track.getCapabilities(); if(caps&&caps.torch){ var tb=document.getElementById('scantorch'); if(tb) tb.style.display=''; } }catch(e){}
          try{ track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
          return v.play();
        })
        .then(function(){ if(rodando) ler(); })
        .catch(function(err){
          if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; track=null; } // não deixa a câmera presa
          var n=err&&err.name;
          setMsg(n==='NotAllowedError'?'Permissão de câmera negada.'
               :n==='NotFoundError'?'Nenhuma câmera encontrada.'
               :n==='NotReadableError'?'A câmera está em uso por outro app.'
               :'Não consegui abrir a câmera.');
        });
    }

    function ler(){
      if(!rodando) return;
      var v=document.getElementById('scanvid');
      if(v && v.readyState>=2 && detector){
        detector.detect(v).then(function(codes){
          if(!rodando) return;                        // fechou enquanto detectava — não abre nada
          for(var i=0;i<codes.length;i++){
            var c=normaliza(codes[i].rawValue);
            if(eanValido(c)){ achou(c); return; }
          }
          if(rodando) timer=setTimeout(ler,120);
        }).catch(function(){ if(rodando) timer=setTimeout(ler,160); });
      } else if(rodando){ timer=setTimeout(ler,120); }
    }

    function achou(ean){
      if(navigator.vibrate) navigator.vibrate(80);
      fechar();
      if(typeof q!=='undefined'){ q.value=ean; }
      if(typeof buscar==='function') buscar();
      setTimeout(function(){
        var r=window.__RES__;
        if(r && r.length){ abrirProduto(r[0]); }
        else if(typeof abrirProduto==='function'){ abrirProduto({n:'Código '+ean, termo:'', m:'', c:'', e:ean, i:null}); }
      },220);
    }

    function luz(){
      if(!track) return;
      try{ track.applyConstraints({advanced:[{torch:!torchOn}]}); torchOn=!torchOn; }catch(e){}
    }

    function fechar(){
      rodando=false;
      if(timer){ clearTimeout(timer); timer=null; }
      if(track && torchOn){ try{ track.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
      if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; }
      track=null; torchOn=false; detector=null;
      if(ov){ ov.remove(); ov=null; }
    }

    document.addEventListener('visibilitychange', function(){ if(document.hidden && rodando) fechar(); });
    btn.addEventListener('click', abrir);
  })();
</script>
